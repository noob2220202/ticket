<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 - 복드림 상품권</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-gate" id="adminGate">
  <div class="admin-gate-card">
    <h1>관리자 로그인</h1>
    <p>내부 직원 전용 페이지입니다.</p>
    <form id="adminGateForm">
      <input type="password" id="adminGatePw" placeholder="관리자 비밀번호" autocomplete="off" required>
      <p class="admin-gate-error" id="adminGateError"></p>
      <button type="submit">입장</button>
    </form>
  </div>
</div>

<div id="adminDashboard" hidden>
  <div class="admin-wrap">
    <div class="admin-header">
      <div>
        <h1>주문 · 매입 관리</h1>
        <div class="admin-sub">복드림 상품권 관리자 대시보드</div>
      </div>
      <div class="admin-header-actions">
        <button class="admin-new-invoice" id="newInvoiceBtn">+ 새 인보이스 작성</button>
        <button class="admin-logout" id="adminLogout">로그아웃</button>
      </div>
    </div>

    <div class="admin-stats">
      <div class="stat-card">
        <div class="stat-label">전체 건수</div>
        <div class="stat-value" id="statTotal">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">완료</div>
        <div class="stat-value" id="statCompleted">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">처리 대기</div>
        <div class="stat-value" id="statPending">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">완료 건 정산 합계</div>
        <div class="stat-value" id="statAmount">-</div>
      </div>
    </div>

    <div class="admin-toolbar">
      <select id="filterBrand">
        <option value="all">전체 브랜드</option>
        <option value="lotte">롯데백화점</option>
        <option value="shinsegae">신세계백화점</option>
        <option value="hyundai">현대백화점</option>
        <option value="galleria">갤러리아</option>
        <option value="guk">국민관광</option>
        <option value="keumkang">금강제화</option>
        <option value="oil">주유상품권</option>
        <option value="etc">기타</option>
      </select>
      <select id="filterType">
        <option value="all">전체 유형</option>
        <option value="매입">매입</option>
        <option value="판매">판매</option>
      </select>
      <select id="filterStatus">
        <option value="all">전체 상태</option>
        <option value="완료">완료</option>
        <option value="입금대기">입금대기</option>
        <option value="확인중">확인중</option>
        <option value="취소">취소</option>
      </select>
      <input type="text" id="filterKeyword" placeholder="주문번호, 인보이스번호, 고객명 검색">
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>주문번호</th>
            <th>일시</th>
            <th>유형</th>
            <th>브랜드</th>
            <th>액면가 × 수량</th>
            <th>정산금액</th>
            <th>고객</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
      </table>
      <p class="admin-empty" id="orderEmpty" hidden>조건에 맞는 주문이 없습니다.</p>
    </div>
  </div>
</div>

<div class="invoice-overlay" id="invoiceOverlay" hidden>
  <div class="invoice-sheet">
    <div class="invoice-toolbar">
      <button type="button" id="invoiceDelete" class="btn-delete" hidden>이 인보이스 삭제</button>
      <button type="button" id="invoicePrint" class="btn-print">PDF로 저장 / 인쇄</button>
      <button type="button" id="invoiceClose">닫기</button>
    </div>
    <div class="invoice-doc" id="invoiceBody"></div>
  </div>
</div>

<div class="invoice-overlay" id="createOverlay" hidden>
  <div class="invoice-sheet create-sheet">
    <div class="invoice-toolbar">
      <button type="button" id="createClose">닫기</button>
    </div>
    <form class="create-form" id="createForm">
      <h2>새 인보이스 작성</h2>
      <p class="create-sub">다른 채널에서 이미 진행된 거래 내역을 직접 입력해 인보이스를 생성합니다.</p>

      <div class="create-grid">
        <div class="form-group">
          <label for="cType">거래유형</label>
          <select id="cType">
            <option value="매입">매입</option>
            <option value="판매">판매</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cStatus">처리상태</label>
          <select id="cStatus">
            <option value="완료">완료</option>
            <option value="입금대기">입금대기</option>
            <option value="확인중">확인중</option>
            <option value="취소">취소</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cBrand">브랜드</label>
          <select id="cBrand">
            <option value="lotte">롯데백화점</option>
            <option value="shinsegae">신세계백화점</option>
            <option value="hyundai">현대백화점</option>
            <option value="galleria">갤러리아</option>
            <option value="guk">국민관광</option>
            <option value="keumkang">금강제화</option>
            <option value="oil">주유상품권</option>
            <option value="etc">기타(직접입력)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cBrandName">브랜드명(인보이스 표시용)</label>
          <input type="text" id="cBrandName" placeholder="예: 롯데백화점 상품권">
        </div>
        <div class="form-group">
          <label for="cDate">거래일시</label>
          <input type="datetime-local" id="cDate">
        </div>
        <div class="form-group">
          <label for="cStaff">담당자</label>
          <input type="text" id="cStaff" placeholder="예: 관리자">
        </div>
        <div class="form-group">
          <label for="cDenom">액면가(1개, 원)</label>
          <input type="number" id="cDenom" min="0" step="1000" required>
        </div>
        <div class="form-group">
          <label for="cQty">수량</label>
          <input type="number" id="cQty" min="1" step="1" value="1" required>
        </div>
        <div class="form-group">
          <label for="cDiscount">할인율(%)</label>
          <input type="number" id="cDiscount" min="0" max="100" step="0.01" value="0">
        </div>
        <div class="form-group">
          <label for="cSettlement">정산금액(원, 비워두면 자동계산)</label>
          <input type="number" id="cSettlement" min="0" step="1" placeholder="자동계산">
        </div>
        <div class="form-group">
          <label for="cName">고객명</label>
          <input type="text" id="cName" required>
        </div>
        <div class="form-group">
          <label for="cPhone">연락처</label>
          <input type="text" id="cPhone" placeholder="010-0000-0000" required>
        </div>
        <div class="form-group">
          <label for="cPayment">결제수단</label>
          <input type="text" id="cPayment" placeholder="예: 계좌이체">
        </div>
        <div class="form-group">
          <label for="cBank">은행</label>
          <input type="text" id="cBank" placeholder="예: 국민은행">
        </div>
        <div class="form-group create-grid-full">
          <label for="cAccount">계좌번호</label>
          <input type="text" id="cAccount" placeholder="예: 123-456-789012">
        </div>
      </div>

      <div class="form-group">
        <label for="cMemo">메모</label>
        <textarea id="cMemo" rows="2" placeholder="예: 타 플랫폼 주문번호 등 참고사항"></textarea>
      </div>

      <p class="form-message error" id="createError" hidden></p>

      <button type="submit" class="btn-block">인보이스 생성</button>
    </form>
  </div>
</div>

<script src="js/orders-data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
