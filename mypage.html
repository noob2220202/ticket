<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 - 카카오상품권</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <div class="inner">
    <div class="auth-links" id="authLinks">
      <a href="cart.html" class="cart-link">장바구니<span class="cart-count" id="cartCount" hidden>0</span></a>
      <a href="login.html" class="auth-guest">로그인</a>
      <a href="signup.html" class="auth-guest">회원가입</a>
      <span class="auth-user" id="authUser" hidden>
        <strong id="authUserName"></strong>님 환영합니다
        <a href="mypage.html">마이페이지</a>
        <button type="button" id="logoutBtn">로그아웃</button>
      </span>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">K</span>
      카카오상품권
    </a>
  </div>
</header>

<main class="page-section">
  <div class="inner">
    <div class="section-head">
      <h1 class="section-title">마이페이지</h1>
      <p class="section-sub">회원 정보와 주문내역을 확인할 수 있습니다</p>
    </div>

    <section class="checkout-block profile-block">
      <h2>회원 정보</h2>
      <dl class="profile-info" id="profileInfo"></dl>
    </section>

    <section class="checkout-block">
      <h2>주문내역</h2>
      <table class="cart-table" id="orderHistoryTable">
        <thead>
          <tr>
            <th>주문번호</th>
            <th>주문일시</th>
            <th>상품권</th>
            <th>결제 예정 금액</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="orderHistoryBody"></tbody>
      </table>
      <p class="empty-state" id="orderHistoryEmpty" hidden>아직 주문내역이 없습니다.</p>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="inner">
    <div class="footer-top">
      <span class="footer-logo">카카오상품권</span>
      <ul class="util-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="about.html">회사소개</a></li>
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="privacy.html">개인정보처리방침</a></li>
        <li><a href="guide.html">이용안내</a></li>
      </ul>
    </div>
    <p class="copyright">Copyright &copy; 카카오상품권. All rights reserved.</p>
  </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
