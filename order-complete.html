<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문 완료 - 카카오상품권</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <div class="inner">
    <div class="auth-links" id="authLinks">
      <a href="cart.html" class="cart-link">장바구니<span class="cart-count" id="cartCount" hidden>0</span></a>
      <a href="login.html" class="auth-guest">로그인</a>
      <a href="signup.html" class="auth-guest">회원가입</a>
      <span class="auth-user" id="authUser" hidden>
        <strong id="authUserName"></strong>님 환영합니다
        <a href="mypage.html">마이페이지</a>
        <button type="button" id="logoutBtn">로그아웃</button>
      </span>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">K</span>
      카카오상품권
    </a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card complete-card">
    <div class="complete-icon">&#10003;</div>
    <h1>주문이 접수되었습니다</h1>
    <p class="auth-sub" id="orderIdText"></p>
    <p class="complete-desc">담당자가 남겨주신 연락처로 결제 방법을 안내드립니다.<br>결제 확인 후 상품권을 발송해드립니다.</p>
    <div class="complete-actions">
      <a href="mypage.html" class="btn btn-primary btn-block">주문내역 확인하기</a>
      <a href="index.html" class="btn btn-ghost-line btn-block">쇼핑 계속하기</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="inner">
    <div class="footer-top">
      <span class="footer-logo">카카오상품권</span>
      <ul class="util-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="about.html">회사소개</a></li>
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="privacy.html">개인정보처리방침</a></li>
        <li><a href="guide.html">이용안내</a></li>
      </ul>
    </div>
    <p class="copyright">Copyright &copy; 카카오상품권. All rights reserved.</p>
  </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
  const lastOrderId = sessionStorage.getItem('kk_last_order');
  const orderIdText = document.getElementById('orderIdText');
  if (lastOrderId && orderIdText) {
    orderIdText.textContent = '주문번호 ' + lastOrderId;
  }
</script>
</body>
</html>
