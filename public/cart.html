<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장바구니 - 카카오상품권</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" id="pretendardFont" media="print" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="js/font-loader.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <div class="inner">
    <div class="auth-links" id="authLinks">
      <a href="cart.html" class="cart-link">장바구니<span class="cart-count" id="cartCount" hidden>0</span></a>
      <a href="login.html" class="auth-guest">로그인</a>
      <a href="signup.html" class="auth-guest">회원가입</a>
      <span class="auth-user" id="authUser" hidden>
        <strong id="authUserName"></strong>님 환영합니다
        <a href="mypage.html">마이페이지</a>
        <button type="button" id="logoutBtn">로그아웃</button>
      </span>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">K</span>
      카카오상품권
    </a>
  </div>
</header>

<main class="page-section">
  <div class="inner">
    <div class="section-head">
      <h1 class="section-title">장바구니</h1>
      <p class="section-sub">담아두신 상품권을 확인하고 주문을 진행해주세요</p>
    </div>

    <div id="cartWrap">
      <table class="cart-table" id="cartTable">
        <thead>
          <tr>
            <th>상품권</th>
            <th>판매가</th>
            <th>수량</th>
            <th>소계</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cartBody"></tbody>
      </table>

      <div class="cart-summary">
        <button type="button" class="btn btn-ghost-line" id="clearCartBtn">장바구니 비우기</button>
        <div class="cart-total">
          총 결제 예정 금액 <strong id="cartTotal">0원</strong>
        </div>
        <button type="button" class="btn btn-primary" id="orderBtn">주문하기</button>
      </div>
    </div>

    <p class="empty-state" id="cartEmpty" hidden>
      장바구니가 비어 있습니다. <a href="index.html#products">상품권 둘러보러 가기</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="inner">
    <div class="footer-top">
      <span class="footer-logo">카카오상품권</span>
      <ul class="util-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="about.html">회사소개</a></li>
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="privacy.html">개인정보처리방침</a></li>
        <li><a href="guide.html">이용안내</a></li>
      </ul>
    </div>
    <p class="copyright">Copyright &copy; 카카오상품권. All rights reserved.</p>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
