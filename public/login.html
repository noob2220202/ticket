<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 카카오상품권</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" id="pretendardFont" media="print" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="js/font-loader.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <div class="inner">
    <div class="auth-links" id="authLinks">
      <a href="cart.html" class="cart-link">장바구니<span class="cart-count" id="cartCount" hidden>0</span></a>
      <a href="login.html" class="auth-guest">로그인</a>
      <a href="signup.html" class="auth-guest">회원가입</a>
      <span class="auth-user" id="authUser" hidden>
        <strong id="authUserName"></strong>님 환영합니다
        <a href="mypage.html">마이페이지</a>
        <button type="button" id="logoutBtn">로그아웃</button>
      </span>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">K</span>
      카카오상품권
    </a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>로그인</h1>
    <p class="auth-sub">아이디와 비밀번호를 입력해주세요.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="userId">아이디</label>
        <input type="text" id="userId" name="userId" required>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
      </div>

      <p class="form-message" id="formMessage" hidden></p>

      <button type="submit" class="btn btn-primary btn-block">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="inner">
    <div class="footer-top">
      <span class="footer-logo">카카오상품권</span>
      <ul class="util-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="about.html">회사소개</a></li>
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="privacy.html">개인정보처리방침</a></li>
        <li><a href="guide.html">이용안내</a></li>
      </ul>
    </div>
    <p class="copyright">Copyright &copy; 카카오상품권. All rights reserved.</p>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/login.js"></script>
</body>
</html>
