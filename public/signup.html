<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - 카카오상품권</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" id="pretendardFont" media="print" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="js/font-loader.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
  <div class="inner">
    <div class="auth-links" id="authLinks">
      <a href="cart.html" class="cart-link">장바구니<span class="cart-count" id="cartCount" hidden>0</span></a>
      <a href="login.html" class="auth-guest">로그인</a>
      <a href="signup.html" class="auth-guest">회원가입</a>
      <span class="auth-user" id="authUser" hidden>
        <strong id="authUserName"></strong>님 환영합니다
        <a href="mypage.html">마이페이지</a>
        <button type="button" id="logoutBtn">로그아웃</button>
      </span>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">K</span>
      카카오상품권
    </a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>회원가입</h1>
    <p class="auth-sub">카카오상품권 회원이 되고 실시간 시세와 우대 혜택을 받아보세요.</p>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="userId">아이디</label>
        <input type="text" id="userId" name="userId" placeholder="영문, 숫자 4자 이상" required minlength="4">
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="6자 이상" required minlength="6">
      </div>

      <div class="form-group">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" required minlength="6">
      </div>

      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="phone">휴대폰번호</label>
        <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required pattern="^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$">
      </div>

      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required>
      </div>

      <label class="form-check">
        <input type="checkbox" id="agree" required>
        <span>[필수] 이용약관 및 개인정보처리방침에 동의합니다.</span>
      </label>

      <p class="form-message" id="formMessage" hidden></p>

      <button type="submit" class="btn btn-primary btn-block">가입하기</button>
    </form>

    <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="inner">
    <div class="footer-top">
      <span class="footer-logo">카카오상품권</span>
      <ul class="util-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="about.html">회사소개</a></li>
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="privacy.html">개인정보처리방침</a></li>
        <li><a href="guide.html">이용안내</a></li>
      </ul>
    </div>
    <p class="copyright">Copyright &copy; 카카오상품권. All rights reserved.</p>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
